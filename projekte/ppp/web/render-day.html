<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>EID Tages-Renderings</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:1600px;height:1000px}</style></head>
<body><canvas id="c"></canvas><script type="module">
// Nur Entwicklung: rendert die Tagesszene zu einer Uhrzeit (?h=13.5) als Standbild für die Startseite.
import { createEnergyScene } from '/src/three/energyScene.js';
import { money } from '/src/lib/money.js';
const h = Number(new URLSearchParams(location.search).get('h') || 13);
const s = createEnergyScene(document.getElementById('c'), { hero: true });
s.setHour(h, money(h).soc);
setTimeout(() => { s.setHour(h, money(h).soc); window.__png = document.getElementById("c").toDataURL("image/png"); window.__rendered = true; }, 1500);
</script></body></html>
